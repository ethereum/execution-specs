name: Rebase EIP Branch
description: Rebases an EIP branch onto a fork branch
inputs:
  fork:
    description: 'Fork name (e.g., amsterdam)'
    required: true
  eip_number:
    description: 'EIP number'
    required: true
runs:
  using: "composite"
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Rebase EIP branch (create if missing)
      shell: bash
      env:
        FORK: ${{ inputs.fork }}
        EIP_NUMBER: ${{ inputs.eip_number }}
      run: |
        set -euo pipefail

        echo "FORK=$FORK"
        echo "EIP_NUMBER=$EIP_NUMBER"
        EIP_BRANCH="eips/${FORK}/eip-${EIP_NUMBER}"
        FORK_BRANCH="forks/${FORK}"

        git fetch origin --prune

        # Sanity: fork base must exist
        if ! git show-ref --verify --quiet "refs/remotes/origin/${FORK_BRANCH}"; then
          echo "Error: Base fork branch origin/${FORK_BRANCH} does not exist"
          exit 1
        fi

        # Create local branch from remote if it exists, else create from fork base
        if git show-ref --verify --quiet "refs/remotes/origin/${EIP_BRANCH}"; then
          echo "Checking out existing ${EIP_BRANCH} (tracking origin)"
          git checkout -B "${EIP_BRANCH}" "origin/${EIP_BRANCH}"
        else
          echo "Branch ${EIP_BRANCH} does not exist on origin; creating from origin/${FORK_BRANCH}"
          git checkout -B "${EIP_BRANCH}" "origin/${FORK_BRANCH}"

          # First push creates the remote branch (no force needed)
          git push -u origin "${EIP_BRANCH}"
        fi

        echo "Rebasing ${EIP_BRANCH} onto origin/${FORK_BRANCH}"
        if ! git rebase "origin/${FORK_BRANCH}"; then
          echo "Error: Rebase conflict occurred while rebasing ${EIP_BRANCH} onto ${FORK_BRANCH}"
          git rebase --abort || true
          exit 1
        fi

        echo "Rebase successful"

    - name: Push rebased branch
      shell: bash
      env:
        FORK: ${{ inputs.fork }}
        EIP_NUMBER: ${{ inputs.eip_number }}
      run: |
        EIP_BRANCH="eips/${FORK}/eip-${EIP_NUMBER}"
        echo "Force pushing ${EIP_BRANCH} to origin"
        git push --force-with-lease origin "${EIP_BRANCH}"
