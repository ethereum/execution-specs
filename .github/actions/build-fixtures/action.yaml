name: Build and Package Fixture Release
description: Build test fixtures and package them for release
inputs:
  release_name:
    description: "Name of the fixture release"
    required: true
  split_label:
    description: "Label for this split. Empty for unsplit builds."
    default: ""
  splits:
    description: "Total number of pytest-split groups (0 = unsplit)."
    default: "0"
  group:
    description: "Which pytest-split group to run (1-indexed, 0 = unsplit)."
    default: "0"
  store_durations:
    description: "Store pytest-split durations for future load balancing."
    default: "false"
  use_pre_alloc_groups:
    description: "Use pre-existing pre-alloc groups (skip phase 1)."
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-uv
      with:
        enable-cache: "false"
    - uses: ./.github/actions/setup-env
    - name: Install EEST
      shell: bash
      run: uv sync --no-progress
    - name: Extract fixture release properties from config
      id: properties
      shell: bash
      run: |
        echo "release_name=${{ inputs.release_name }}"
        uv run -q .github/scripts/get_release_props.py ${{ inputs.release_name }} >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/build-evm-base
      id: evm-builder
      with:
        type: ${{ steps.properties.outputs.evm-type }}
    - name: Install pigz for parallel tarball compression
      if: inputs.split_label == ''
      shell: bash
      run: sudo apt-get install -y pigz
    - name: Diagnose split durations
      if: inputs.split_label != ''
      shell: bash
      run: uv run python .github/scripts/diagnose_durations.py
    - name: Install split debug conftest
      if: inputs.split_label != ''
      shell: bash
      run: cp .github/scripts/split_debug_plugin.py tests/conftest.py
    - name: Generate fixtures using fill
      shell: bash
      run: |
        IS_SPLIT="${{ inputs.split_label }}"

        if [ -n "$IS_SPLIT" ]; then
          OUTPUT_ARG="--output=fixtures_${{ inputs.release_name }}"
          SPLIT_ARGS="--splitting-algorithm=least_duration --generate-all-formats --splits=${{ inputs.splits }} --group=${{ inputs.group }} --single-fixture-per-file"
        else
          OUTPUT_ARG="--output=fixtures_${{ inputs.release_name }}.tar.gz"
          SPLIT_ARGS=""
        fi

        DURATIONS_ARG=""
        if [ "${{ inputs.store_durations }}" = "true" ]; then
          DURATIONS_ARG="--store-durations"
        fi

        PRE_ALLOC_ARG=""
        if [ "${{ inputs.use_pre_alloc_groups }}" = "true" ]; then
          PRE_ALLOC_ARG="--use-pre-alloc-groups"
        fi

        # Allow exit code 5 (NO_TESTS_COLLECTED) for groups with no tests.
        EXIT_CODE=0
        if [ "${{ steps.evm-builder.outputs.impl }}" = "eels" ]; then
          uv run fill -n ${{ steps.evm-builder.outputs.x-dist }} ${{ steps.properties.outputs.fill-params }} $SPLIT_ARGS $OUTPUT_ARG --build-name ${{ inputs.release_name }} --no-html --durations=100 --log-level=INFO $DURATIONS_ARG $PRE_ALLOC_ARG || EXIT_CODE=$?
        else
          uv run fill -n ${{ steps.evm-builder.outputs.x-dist }} --evm-bin=${{ steps.evm-builder.outputs.evm-bin }} ${{ steps.properties.outputs.fill-params }} $SPLIT_ARGS $OUTPUT_ARG --build-name ${{ inputs.release_name }} --no-html --durations=100 --log-level=INFO $DURATIONS_ARG $PRE_ALLOC_ARG || EXIT_CODE=$?
        fi
        if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 5 ]; then
          exit "$EXIT_CODE"
        fi
    - name: Generate Benchmark Genesis Files
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: ./.github/actions/build-benchmark-genesis
      with:
        fixtures_path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload Benchmark Genesis Artifact
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: benchmark_genesis_${{ inputs.release_name }}
        path: benchmark_genesis.tar.gz
    - name: Upload fixture tarball (unsplit)
      if: inputs.split_label == ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures_${{ inputs.release_name }}
        path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload fixture directory (split)
      if: inputs.split_label != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures__${{ inputs.split_label }}
        include-hidden-files: true
        path: fixtures_${{ inputs.release_name }}/
        if-no-files-found: ignore
    - name: Upload durations (split)
      if: inputs.store_durations == 'true' && inputs.split_label != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: durations__${{ inputs.split_label }}
        include-hidden-files: true
        path: .test_durations
        if-no-files-found: ignore
    - name: Upload durations (unsplit)
      if: inputs.store_durations == 'true' && inputs.split_label == ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: durations_${{ inputs.release_name }}
        include-hidden-files: true
        path: .test_durations
