name: "Fetch and Install Binary"
description: "Downloads a binary from a GitHub release, verifies its checksum, and installs it to PATH. Only works for Linux."
inputs:
  version:
    description: "Release version (e.g., v0.8.24)"
    required: true
  repo_owner:
    description: "GitHub repository owner"
    required: true
  repo_name:
    description: "GitHub repository name"
    required: true
  remote_name:
    description: "Binary filename in the release"
    required: true
  binary_name:
    description: "Name to install the binary as"
    required: true
  expected_sha256:
    description: "Expected SHA256 checksum"
    required: true
runs:
  using: "composite"
  steps:
    - name: Download binary
      shell: bash
      env:
        REPO_OWNER: ${{ inputs.repo_owner }}
        REPO_NAME: ${{ inputs.repo_name }}
        VERSION: ${{ inputs.version }}
        REMOTE_NAME: ${{ inputs.remote_name }}
        BINARY_NAME: ${{ inputs.binary_name }}
        EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      run: |
        curl -sSL "https://github.com/${REPO_OWNER}/${REPO_NAME}/releases/download/${VERSION}/${REMOTE_NAME}" -o "./${BINARY_NAME}"
        echo "${EXPECTED_SHA256}  ${BINARY_NAME}" | sha256sum -c -
        sudo mv "./${BINARY_NAME}" "/usr/local/bin/${BINARY_NAME}"
        sudo chmod +x "/usr/local/bin/${BINARY_NAME}"
