name: Setup Environment
description: Common setup for Ethereum Spec jobs
runs:
  using: "composite"
  steps:
    - name: Update apt package index
      shell: bash
      run: sudo apt-get update

    - name: Install Rust
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --force-yes build-essential rustup
        rustup update --no-self-update 1.89.0 && rustup default 1.89.0
        echo "$(dirname "$(rustup which rustc)")" >> "$GITHUB_PATH"

    - name: Install build dependencies
      shell: bash
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --force-yes build-essential pkg-config pkgconf autoconf libtool
        # Verify pkg-config is available; create symlink if only pkgconf exists
        if ! command -v pkg-config &> /dev/null; then
          if command -v pkgconf &> /dev/null; then
            echo "pkg-config not found but pkgconf exists, creating symlink"
            sudo ln -s "$(command -v pkgconf)" /usr/local/bin/pkg-config
          else
            echo "ERROR: Neither pkg-config nor pkgconf found after install"
            exit 1
          fi
        fi
        echo "pkg-config location: $(command -v pkg-config)"
        pkg-config --version

    - name: Download Geth and add to $PATH
      shell: bash
      run: |
        mkdir -p $GITHUB_WORKSPACE/bin
        $GITHUB_WORKSPACE/scripts/download_geth_linux.py --dir $GITHUB_WORKSPACE/bin
        echo $GITHUB_WORKSPACE/bin >> $GITHUB_PATH
