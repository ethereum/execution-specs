name: Python Specification

on:
  push:
    branches:
      - master
      - mainnet
      - "forks/**"
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - ".gitignore"
      - ".vscode/**"
      - "whitelist.txt"
      - "docs/**"                                                                                                                     
      - "mkdocs.yml"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE*"
      - ".gitignore"
      - ".vscode/**"
      - "whitelist.txt"
      - "docs/**"                                                                                                                     
      - "mkdocs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fast-checks:
    uses: ./.github/workflows/fast-checks.yaml

  py3:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-env
      - name: Run py3 tests
        run: tox -e py3
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: .tox/coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

  pypy3:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "pypy3.11"
      - uses: ./.github/actions/setup-env
      - name: Run pypy3 tests
        run: tox -e pypy3
        env:
          PYPY_GC_MAX: "2G"
          PYPY_GC_MIN: "1G"

  json_infra:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch full history for commit comparison
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/get-changed-files
        id: get-changed-files
      - name: Run json infra tests
        run: tox -e json_infra -- --file-list="${{ steps.get-changed-files.outputs.file_list }}"

  optimized:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch full history for commit comparison
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/get-changed-files
        id: get-changed-files
      - name: Run optimized tests
        run: tox -e optimized -- --file-list="${{ steps.get-changed-files.outputs.file_list }}"

  tests_pytest_py3:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/build-evmone
      - name: Run py3 tests
        run: tox -e tests_pytest_py3

  tests_pytest_pypy3:
    runs-on: [self-hosted-ghr, size-xl-x64]
    needs: fast-checks
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "pypy3.11"
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/build-evmone
      - name: Run pypy3 tests
        run: tox -e tests_pytest_pypy3
        env:
          PYPY_GC_MAX: "2G"
          PYPY_GC_MIN: "1G"
