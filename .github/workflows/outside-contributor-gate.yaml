name: Outside contributor gate

# Closes an outside contributor's pull request unless it references an
# issue they are assigned to. Issues are never closed. Outside contributors
# are authors who are neither collaborators nor organization members,
# unless they are on the bypass list in
# .github/configs/outside-contributor-gate-bypass.txt. See CONTRIBUTING.md.
#
# Runs from the base branch via `pull_request_target`, so fork pull requests
# get a write token. The pull request's code is never checked out, and its
# body only reaches the script through the event payload, never a `run:`
# expression. A maintainer overrides the gate by reopening the pull request.
#
# A pull request event runs the workflow of the pull request's base branch,
# so the event only gates pull requests into the default branch. A schedule,
# which always runs on the default branch, sweeps every other branch.

on:
  pull_request_target:
    types: [ opened, reopened ]
  schedule:
    # Avoid the top of the hour, when scheduled runs are most often delayed.
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Gate
    # Skip collaborators and members before a runner starts.
    if: >-
      github.event_name == 'schedule'
      || (
        !contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.pull_request.author_association
        )
        && github.event.pull_request.base.ref
          == github.event.repository.default_branch
      )
    concurrency:
      group: >-
        ${{ github.workflow }}-${{
          github.event.pull_request.number || 'sweep'
        }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: "false"
      - name: Close pull requests that break the rules
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run -q .github/scripts/outside_contributor_gate.py
      - name: Sweep pull requests into other branches
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run -q .github/scripts/outside_contributor_gate.py --sweep
