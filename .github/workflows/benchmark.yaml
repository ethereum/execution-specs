name: Benchmarking

on:
  push:
    branches:
      - mainnet
      - "forks/**"
    paths:
      - "tests/benchmark/**"
      - "packages/testing/src/execution_testing/benchmark/**"
      - "packages/testing/src/execution_testing/cli/pytest_commands/plugins/**"
      - ".github/workflows/benchmark.yaml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # Job-level path filter: the workflow must always run on PRs so its
  # gate can be a required status check (skipped workflows never report).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant || 'true' }}
    steps:
      - name: Filter relevant paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: "every"
          filters: |
            relevant:
              - "**"
              - "!**/*.md"
              - "!LICENSE*"
              - "!.gitignore"
              - "!.vscode/**"
              - "!whitelist.txt"
              - "!docs/**"
              - "!mkdocs.yml"

  unit-tests:
    name: Benchmark Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: "false"

      - uses: ./.github/actions/build-evm-base
        id: evm-builder
        with:
          type: benchmark

      - name: Run benchmark unit tests
        run: just test-tests-bench
        env:
          EVM_BIN: ${{ steps.evm-builder.outputs.evm-bin }}

  sanity-checks:
    name: ${{ matrix.name }}
    needs: [unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Benchmark Gas Values
            recipe: bench-gas
          - name: Fixed Opcode Count CLI
            recipe: bench-opcode
          - name: Fixed Opcode Count Config
            recipe: bench-opcode-config
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: "false"

      - name: Install PyPy for bench-gas json_loader verify
        if: matrix.recipe == 'bench-gas'
        shell: bash
        run: uv python install pypy3.11

      - uses: ./.github/actions/build-evm-base
        id: evm-builder
        with:
          type: benchmark

      - name: Run ${{ matrix.name }}
        run: just ${{ matrix.recipe }}
        env:
          EVM_BIN: ${{ steps.evm-builder.outputs.evm-bin }}

  # TODO: Add execute remote tests with --gas-benchmark-values
  # TODO: Add execute remote tests with --fixed-opcode-count

  build-artifact:
    name: Build Benchmark Fixture Artifact
    needs: [sanity-checks] # TODO: Add execute remote jobs when implemented
    if: github.event_name == 'push'
    runs-on: [self-hosted-ghr, size-gigachungus-x64]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: ./.github/actions/build-fixtures
        with:
          release_name: benchmark_fast

  gate:
    name: benchmark-gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - unit-tests
      - sanity-checks
      - build-artifact
    if: always()
    steps:
      - name: Check that all jobs passed or were skipped
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq -e \
            '[.[].result] | all(. == "success" or . == "skipped")'
