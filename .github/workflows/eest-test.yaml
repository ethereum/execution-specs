name: Spec Tests & Framework

on:
  push:
    branches:
      - mainnet
      - 'forks/**'
    paths:
      - 'src/ethereum_spec_tests/**'
      - 'tests/eest/**'
      - '.github/workflows/eest-test.yaml'
      - '.github/actions/eest/**'
      - '.github/configs/**'
      - 'tox.ini'
      - 'pyproject.toml'
      - 'ruff.eest.toml'
      - 'mypy.eest.ini'
  pull_request:
    paths:
      - 'src/ethereum_spec_tests/**'
      - 'tests/eest/**'
      - '.github/workflows/eest-test.yaml'
      - '.github/actions/eest/**'
      - '.github/configs/**'
      - 'tox.ini'
      - 'pyproject.toml'
      - 'ruff.eest.toml'
      - 'mypy.eest.ini'
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint python sources with ruff
        runs-on: ubuntu-latest
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ vars.DEFAULT_PYTHON_VERSION }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
            - name: Run ruff linter via tox
              run: uvx --with=tox-uv tox -e eest-lint

    typecheck:
        name: Typecheck python sources with mypy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ vars.DEFAULT_PYTHON_VERSION }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
            - name: Run mypy typechecker via tox
              run: uvx --with=tox-uv tox -e eest-typecheck

    spellcheck:
        name: Spellcheck sources with codespell
        runs-on: ubuntu-latest
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ vars.DEFAULT_PYTHON_VERSION }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
            - name: Run spellcheck with codespell via tox
              run: uvx --with=tox-uv tox -e eest-spellcheck
              env:
                  GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
    
