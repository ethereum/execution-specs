    mkdocs:
        name: Build html documentation with mkdocs
        runs-on: ubuntu-latest
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ vars.DEFAULT_PYTHON_VERSION }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
            - name: Build html documentation with mkdocs via tox
              run: uvx --with=tox-uv tox -e eest-mkdocs

    pytest_framework:
        name: Run unit tests, ${{ matrix.os }}, ${{ matrix.python }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: macos-15
                      python: "3.11"
                    - os: macos-15
                      python: "pypy3.11"
                    - os: ubuntu-latest
                      python: "3.12"
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ matrix.python }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ matrix.python }}
            - name: Build EVMONE EVM
              uses: ./.github/actions/eest/build-evm-client/evmone
              with:
                  targets: "evmone-t8n"
            - name: Build GETH EVM
              uses: ./.github/actions/eest/build-evm-client/geth
            - name: Run tox - run framework unit tests with pytest
              run: uvx --with=tox-uv tox -e eest-pytest

    tests_deployed:
        name: Fill tests, deployed, ${{ matrix.name }}, ${{ matrix.python }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: [self-hosted-ghr, size-chungus-x64]
                      name: self-hosted-ghr-chungus-x64
                      python: "3.11"
                    - os: macos-15
                      name: macos-15
                      python: "3.12"
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ matrix.python }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ matrix.python }}
            - name: Run tox - fill tests for deployed forks
              run: uvx --with=tox-uv tox -e eest-tests-deployed

    tests_deployed_benchmark:
        name: Fill benchmark test cases, deployed, ${{ matrix.os }}, ${{ matrix.python }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      python: "3.11"
                    - os: macos-15
                      python: "3.12"
                    - os: ubuntu-latest
                      python: "pypy3.11"
        steps:
            - name: Checkout ethereum/execution-specs
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
            - name: Install uv ${{ vars.UV_VERSION }} and python ${{ matrix.python }}
              uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182
              with:
                  enable-cache: true
                  cache-dependency-glob: "uv.lock"
                  version: ${{ vars.UV_VERSION }}
                  python-version: ${{ matrix.python }}
            - name: Build EVMONE EVM
              uses: ./.github/actions/eest/build-evm-client/evmone
              with:
                  targets: "evmone-t8n"
            - name: Run tox - fill tests for deployed forks
              run: uvx --with=tox-uv tox -e eest-tests-deployed-benchmark
