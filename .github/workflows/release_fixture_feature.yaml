name: Create Fixture Release

on:
  push:
    tags:
      - "tests-*@v*"
  workflow_dispatch:
    inputs:
      feature_name:
        description: "Feature to build (e.g. mainnet). Required for dispatch."
        required: true
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      pre_alloc_matrix: ${{ steps.matrix.outputs.pre_alloc_matrix }}
      pre_alloc_labels: ${{ steps.matrix.outputs.pre_alloc_labels }}
      feature_name: ${{ steps.matrix.outputs.feature_name }}
      combine_labels: ${{ steps.matrix.outputs.combine_labels }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/setup-uv

      - name: Generate build matrix
        id: matrix
        shell: bash
        run: |
          if [ -n "${{ inputs.feature_name }}" ]; then
            FEATURE_NAME="${{ inputs.feature_name }}"
          else
            FEATURE_PREFIX="${GITHUB_REF_NAME//@*/}"
            FEATURE_NAME="${FEATURE_PREFIX#tests-}"
          fi
          uv run -q .github/scripts/generate_build_matrix.py "$FEATURE_NAME" >> "$GITHUB_OUTPUT"

  generate-pre-alloc:
    name: pre-alloc (${{ matrix.label }})
    needs: setup
    if: needs.setup.outputs.pre_alloc_matrix != '[]'
    runs-on: [self-hosted-ghr, size-gigachungus-x64]
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.setup.outputs.pre_alloc_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Fetch lllc
        uses: ./.github/actions/fetch-binary
        with:
          version: v1.0.0
          repo_owner: felix314159
          repo_name: lllc-custom
          remote_name: lllc
          binary_name: lllc
          expected_sha256: 865a0d5379acb3b5471337b5dcf686a2dd71587c6b65b9da6c963de627e0b300

      - name: Fetch Solidity
        uses: ./.github/actions/fetch-binary
        with:
          version: v0.8.24
          repo_owner: ethereum
          repo_name: solidity
          remote_name: solc-static-linux
          binary_name: solc
          expected_sha256: fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f

      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: "false"
      - uses: ./.github/actions/setup-env
      - name: Install EEST
        shell: bash
        run: uv sync --no-progress

      - name: Extract fixture release properties from config
        id: properties
        shell: bash
        run: |
          uv run -q .github/scripts/get_release_props.py ${{ needs.setup.outputs.feature_name }} >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-evm-base
        id: evm-builder
        with:
          type: ${{ steps.properties.outputs.evm-type }}

      - name: Generate pre-alloc groups (phase 1, fork range)
        shell: bash
        run: |
          FEATURE_NAME="${{ needs.setup.outputs.feature_name }}"
          EXIT_CODE=0
          if [ "${{ steps.evm-builder.outputs.impl }}" = "eels" ]; then
            uv run fill -n ${{ steps.evm-builder.outputs.x-dist }} ${{ steps.properties.outputs.fill-params }} --generate-pre-alloc-groups --from=${{ matrix.from_fork }} --until=${{ matrix.until_fork }} --output=fixtures_${FEATURE_NAME} --build-name ${FEATURE_NAME} --no-html -qq || EXIT_CODE=$?
          else
            uv run fill -n ${{ steps.evm-builder.outputs.x-dist }} --evm-bin=${{ steps.evm-builder.outputs.evm-bin }} ${{ steps.properties.outputs.fill-params }} --generate-pre-alloc-groups --from=${{ matrix.from_fork }} --until=${{ matrix.until_fork }} --output=fixtures_${FEATURE_NAME} --build-name ${FEATURE_NAME} --no-html -qq || EXIT_CODE=$?
          fi
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 5 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Upload pre-alloc groups
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pre-alloc-groups__${{ matrix.label }}
          path: fixtures_${{ needs.setup.outputs.feature_name }}/
          retention-days: 1
          if-no-files-found: ignore

  build:
    name: fill (${{ matrix.label || matrix.feature }})
    needs: [setup, generate-pre-alloc]
    if: always() && needs.setup.result == 'success' && (needs.generate-pre-alloc.result == 'success' || needs.generate-pre-alloc.result == 'skipped')
    runs-on: [self-hosted-ghr, size-gigachungus-x64]
    timeout-minutes: 1440
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Fetch lllc
        uses: ./.github/actions/fetch-binary
        with:
          version: v1.0.0
          repo_owner: felix314159
          repo_name: lllc-custom
          remote_name: lllc
          binary_name: lllc
          expected_sha256: 865a0d5379acb3b5471337b5dcf686a2dd71587c6b65b9da6c963de627e0b300

      - name: Fetch Solidity
        uses: ./.github/actions/fetch-binary
        with:
          version: v0.8.24
          repo_owner: ethereum
          repo_name: solidity
          remote_name: solc-static-linux
          binary_name: solc
          expected_sha256: fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f

      - name: Download pre-alloc groups
        if: matrix.label != ''
        shell: bash
        run: |
          for label in ${{ needs.setup.outputs.pre_alloc_labels }}; do
            echo "Downloading: pre-alloc-groups__${label}"
            gh run download ${{ github.run_id }} -n "pre-alloc-groups__${label}" --dir "fixtures_${{ matrix.feature }}" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download durations from latest run
        if: matrix.label != ''
        shell: bash
        run: |
          FEATURE_NAME="${{ needs.setup.outputs.feature_name }}"
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=durations_${FEATURE_NAME}&per_page=1" \
            --jq '.artifacts[0].workflow_run.id // empty' 2>/dev/null || true)
          if [ -n "$RUN_ID" ]; then
            echo "Downloading durations from run ${RUN_ID}"
            if gh run download "${RUN_ID}" -n "durations_${FEATURE_NAME}" --dir .; then
              BYTES=$(wc -c < .test_durations)
              SIZE=$(numfmt --to=iec-i --suffix=B "${BYTES}")
              echo "Durations file: ${SIZE}"
              echo "### Durations" >> "$GITHUB_STEP_SUMMARY"
              echo "Downloaded \`durations_${FEATURE_NAME}\` from run [${RUN_ID}](/${{ github.repository }}/actions/runs/${RUN_ID}) (${SIZE})" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Failed to download durations artifact from run ${RUN_ID}, using average durations"
              echo "### Durations" >> "$GITHUB_STEP_SUMMARY"
              echo "⚠️ Download failed for run ${RUN_ID}, using average durations" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::No previous durations artifact found for ${FEATURE_NAME}, using average durations"
            echo "### Durations" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ No previous durations found, using average durations" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: ./.github/actions/setup-uv
        if: matrix.label != ''
        with:
          enable-cache: "false"

      - name: Normalize durations (strip xdist suffixes)
        if: matrix.label != ''
        shell: bash
        run: |
          if [ -f .test_durations ]; then
            uv run --no-project python .github/scripts/normalize_durations.py
          else
            echo "::warning::No .test_durations file to normalize"
          fi

      - uses: ./.github/actions/build-fixtures
        with:
          release_name: ${{ matrix.feature }}
          split_label: ${{ matrix.label }}
          splits: ${{ matrix.splits }}
          group: ${{ matrix.group }}
          store_durations: "true"
          use_pre_alloc_groups: ${{ matrix.label != '' && 'true' || 'false' }}

  combine:
    name: combine (${{ needs.setup.outputs.feature_name }})
    needs: [setup, build]
    if: needs.setup.outputs.combine_labels != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/setup-uv
      - name: Install pigz
        run: sudo apt-get install -y pigz
      - name: Download and merge split artifacts
        shell: bash
        run: |
          mkdir -p combined
          for label in ${{ needs.setup.outputs.combine_labels }}; do
            echo "Downloading: fixtures__${label}"
            if gh run download ${{ github.run_id }} -n "fixtures__${label}" --dir "split_artifacts/fixtures__${label}"; then
              cp -r "split_artifacts/fixtures__${label}"/* combined/
            else
              echo "No artifact for ${label} (no tests collected, skipping)"
            fi
          done
          echo "Combined directory contents:"
          find combined -maxdepth 3 -type d | head -30 || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge split index files
        shell: bash
        run: |
          SPLIT_DIRS=()
          for label in ${{ needs.setup.outputs.combine_labels }}; do
            dir="split_artifacts/fixtures__${label}"
            if [ -d "$dir" ]; then
              SPLIT_DIRS+=("$dir")
            fi
          done
          if [ ${#SPLIT_DIRS[@]} -gt 0 ]; then
            uv run python .github/scripts/merge_index_files.py combined/.meta/index.json "${SPLIT_DIRS[@]}"
          fi
      - name: Download and merge split durations
        shell: bash
        run: |
          DURATIONS_FILES=()
          for label in ${{ needs.setup.outputs.combine_labels }}; do
            echo "Downloading: durations__${label}"
            if gh run download ${{ github.run_id }} -n "durations__${label}" --dir "durations_artifacts/${label}"; then
              DURATIONS_FILES+=("durations_artifacts/${label}/.test_durations")
            else
              echo "No durations for ${label} (skipping)"
            fi
          done
          if [ ${#DURATIONS_FILES[@]} -gt 0 ]; then
            uv run python .github/scripts/merge_durations_files.py .test_durations "${DURATIONS_FILES[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload merged durations
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: durations_${{ needs.setup.outputs.feature_name }}
          include-hidden-files: true
          path: .test_durations
      - name: Free disk space
        run: rm -rf split_artifacts/
      - name: Create release tarball
        shell: bash
        run: |
          uv run -q .github/scripts/create_release_tarball.py combined fixtures_${{ needs.setup.outputs.feature_name }}.tar.gz
      - name: Upload combined fixture tarball
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: fixtures_${{ needs.setup.outputs.feature_name }}
          path: fixtures_${{ needs.setup.outputs.feature_name }}.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [setup, build, combine]
    if: always() && needs.build.result == 'success' && (needs.combine.result == 'success' || needs.combine.result == 'skipped') && startsWith(github.ref, 'refs/tags/tests-')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 0

      - name: Download release artifacts
        shell: bash
        run: |
          gh run download ${{ github.run_id }} -p "fixtures_*" --dir ./artifacts
          rm -rf ./artifacts/fixtures__*/
          gh run download ${{ github.run_id }} -p "benchmark_genesis_*" --dir ./artifacts || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Draft release on EELS (canonical)
        run: |
          FEATURE_PREFIX="${TAG_NAME%%@*}"
          PREV_TAG=$(
            git tag --list "${FEATURE_PREFIX}@v*" --sort=-v:refname \
              | grep -v "^${TAG_NAME}$" \
              | head -n 1 \
            || true
          )
          RELEASE_ARGS=(--draft --generate-notes)
          if [ "$FEATURE_NAME" != "mainnet" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG_NAME" "${RELEASE_ARGS[@]}" ./artifacts/**/*.tar.gz
        env:
          TAG_NAME: ${{ github.ref_name }}
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
          GH_TOKEN: ${{ github.token }}

      - name: Draft release on EEST (mirror)
        run: |
          EEST_TAG="${TAG_NAME#tests-}"
          RELEASE_ARGS=(--repo ethereum/execution-spec-tests --draft)
          if [ "$FEATURE_NAME" != "mainnet" ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          RELEASE_ARGS+=(--notes "This release is mirrored from [ethereum/execution-specs ${TAG_NAME}](https://github.com/ethereum/execution-specs/releases/tag/${TAG_NAME}).")
          gh release create "$EEST_TAG" "${RELEASE_ARGS[@]}" ./artifacts/**/*.tar.gz
        env:
          TAG_NAME: ${{ github.ref_name }}
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
          GH_TOKEN: ${{ secrets.EEST_RELEASE_TOKEN }}
