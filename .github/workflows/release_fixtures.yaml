name: Create Fixture Release

run-name: ${{ github.event_name == 'schedule' && 'Nightly Fill' || format('Create Fixture Release {0}@{1}{2}', inputs.feature, inputs.version, (inputs.cached || inputs.commit != '') && ' (cached)' || '') }}

# Scheduled runs fill the mainnet `tests` feature (all tests, all fixture
# formats, up to the latest mainnet fork -- no dev forks) through the exact
# release pipeline, but skip the `release` job, so no tag or draft release
# is created: a rotating, always-available artifact of the mainnet
# fixtures. The cron fires at 02:00 UTC: the self-hosted runners are past
# the EU/US daytime peaks and results are ready before the EU morning.
#
# A manual `tests` release can reuse the newest of those artifacts
# instead of refilling via the `cached` checkbox: `build` and `combine`
# are skipped and the `release` job drafts from the nightly's tarball,
# tagged at the commit the nightly built. Runs in minutes.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature name, e.g. tests, benchmark, bal-devnet"
        required: true
        type: string
      version:
        description: "Release version, e.g. v20.0.0"
        required: true
        type: string
      branch:
        description: "Branch or source tag to release from, e.g. devnets/bal/7"
        required: false
        type: string
      evm:
        description: "Override the evm impl (e.g. geth, evmone). Defaults to the feature's evm-type."
        required: false
        type: string
      evm_repo:
        description: "Override the t8n tool repo (e.g. ethereum/go-ethereum)"
        required: false
        type: string
      evm_ref:
        description: "Override the t8n tool branch / tag / commit"
        required: false
        type: string
      cached:
        description: "Draft from the newest nightly artifact instead of refilling (tests only)"
        required: false
        type: boolean
        default: false
      commit:
        description: "Release the nightly built at this commit (7+ hex chars); implies cached. Empty = newest."
        required: false
        type: string

concurrency:
  # Scheduled runs queue behind an in-flight nightly (never cancel a
  # fill). Cached releases serialize too: drafts do not reserve their
  # tag name, so parallel dispatches of the same version would silently
  # coexist. Fresh releases are unconstrained (unique group per run).
  group: ${{ github.event_name == 'schedule' && 'nightly-fill' || (inputs.cached || inputs.commit != '') && 'cached-release' || github.run_id }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      # A cached release skips the fill: `build` (and with it `combine`)
      # keys off `run`, and the release job downloads the resolved
      # nightly's artifact and tags the commit it was built from.
      # Manual dispatches skip the new-commit check (its script may not
      # exist on the checked-out devnet branch) and default to `true`.
      run: ${{ (inputs.cached || inputs.commit != '') && 'false' || steps.check.outputs.run || 'true' }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      feature_name: ${{ steps.matrix.outputs.feature_name }}
      combine_labels: ${{ steps.matrix.outputs.combine_labels }}
      target_sha: ${{ steps.cached.outputs.target_sha || steps.target_sha.outputs.sha }}
      short_sha: ${{ steps.target_sha.outputs.short_sha }}
      artifact_run_id: ${{ steps.cached.outputs.run_id }}
      artifact_name: ${{ steps.cached.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          ref: ${{ inputs.branch }}
      - name: Resolve target SHA
        id: target_sha
        shell: bash
        # The short form is a fixed 7-character slice (not `git
        # rev-parse --short`, whose length can drift): the cached-release
        # resolver derives artifact names from the API's full SHA and the
        # two must always agree.
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-uv

      - name: Check zkEVM benchmark release request
        if: inputs.feature == 'zkevm-benchmark'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_REF: ${{ inputs.branch }}
        run: |
          uv run -q .github/scripts/check_zkevm_benchmark_release.py \
            "$INPUT_VERSION" "$INPUT_SOURCE_REF"

      - name: Check for new commits (scheduled runs)
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run -q .github/scripts/check_new_commits.py >> "$GITHUB_OUTPUT"

      - name: Resolve the nightly artifact to reuse (cached releases)
        id: cached
        if: inputs.cached || inputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_FEATURE: ${{ inputs.feature }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          # The feature/branch/version guards, run resolution and
          # ancestry check live in (and are unit-tested via)
          # resolve_cached_release.py.
          uv run -q .github/scripts/resolve_cached_release.py >> "$GITHUB_OUTPUT"

      - name: Validate input and generate build matrix
        id: matrix
        shell: bash
        env:
          # Scheduled runs have no inputs: fill the mainnet `tests`
          # feature; the placeholder version passes validation and is
          # otherwise unused because the `release` job is skipped for
          # scheduled runs.
          INPUT_FEATURE: ${{ inputs.feature || 'tests' }}
          INPUT_VERSION: ${{ inputs.version || 'v0.0.0' }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_EVM: ${{ inputs.evm }}
        run: |
          # The feature, version, devnet-branch and evm-override validation
          # lives in (and is unit-tested via) generate_build_matrix.py.
          uv run -q .github/scripts/generate_build_matrix.py \
            "$INPUT_FEATURE" "$INPUT_VERSION" "$INPUT_BRANCH" "$INPUT_EVM" \
            >> "$GITHUB_OUTPUT"

  build:
    name: fill (${{ matrix.label || matrix.feature }})
    needs: setup
    if: needs.setup.outputs.run == 'true'
    runs-on: [self-hosted-ghr, size-gigachungus-x64]
    timeout-minutes: 1440
    strategy:
      # A release must be complete, so abort on the first failed range; a
      # nightly wants every range's result for debugging.
      fail-fast: ${{ github.event_name != 'schedule' }}
      matrix:
        include: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          ref: ${{ needs.setup.outputs.target_sha }}

      - uses: ./.github/actions/build-fixtures
        with:
          release_name: ${{ matrix.feature }}
          from_fork: ${{ matrix.from_fork }}
          until_fork: ${{ matrix.until_fork }}
          split_label: ${{ matrix.label }}
          # Nightly splits are intermediates consumed by `combine` right
          # away; don't retain them for the repo-default period.
          split_retention_days: ${{ github.event_name == 'schedule' && '1' || '' }}
          evm: ${{ inputs.evm }}
          evm_repo: ${{ inputs.evm_repo }}
          evm_ref: ${{ inputs.evm_ref }}

  combine:
    name: combine (${{ needs.setup.outputs.feature_name }})
    needs: [setup, build]
    if: needs.setup.outputs.combine_labels != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          ref: ${{ needs.setup.outputs.target_sha }}
      - uses: ./.github/actions/setup-uv
      - name: Install pigz
        run: sudo apt-get install -y pigz
      - name: Download and merge split artifacts
        shell: bash
        run: |
          mkdir -p combined
          for label in ${{ needs.setup.outputs.combine_labels }}; do
            echo "Downloading: fixtures__${label}"
            if gh run download ${{ github.run_id }} -n "fixtures__${label}" --dir "split_artifacts/fixtures__${label}"; then
              cp -r "split_artifacts/fixtures__${label}"/* combined/
            else
              echo "No artifact for ${label} (no tests collected, skipping)"
            fi
          done
          echo "Combined directory contents:"
          find combined -maxdepth 3 -type d | head -30 || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge split index files
        shell: bash
        run: |
          SPLIT_DIRS=()
          for label in ${{ needs.setup.outputs.combine_labels }}; do
            dir="split_artifacts/fixtures__${label}"
            if [ -d "$dir" ]; then
              SPLIT_DIRS+=("$dir")
            fi
          done
          if [ ${#SPLIT_DIRS[@]} -gt 0 ]; then
            uv run python .github/scripts/merge_index_files.py combined/.meta/index.json "${SPLIT_DIRS[@]}"
          fi
      - name: Free disk space
        run: rm -rf split_artifacts/
      - name: Create release tarball
        id: tarball
        shell: bash
        env:
          FEATURE_NAME: ${{ needs.setup.outputs.feature_name }}
        run: |
          if [ "$FEATURE_NAME" = "tests" ]; then
            TARBALL="fixtures.tar.gz"
          else
            TARBALL="fixtures_${FEATURE_NAME}.tar.gz"
          fi
          uv run -q .github/scripts/create_release_tarball.py combined "$TARBALL"
          echo "path=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Upload combined fixture tarball
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          # Name the artifact for the built commit so the rolling
          # nightly artifacts are tellable apart at a glance; the
          # cached-release resolver derives this exact name from each
          # run's head SHA. The tarball inside carries the feature name.
          name: fixtures_${{ needs.setup.outputs.short_sha }}
          path: ${{ steps.tarball.outputs.path }}
          # Keep nightly tarballs for five days; a quiet nightly re-runs
          # after four (see check_new_commits.py), so a live artifact
          # always exists. Release tarballs keep the repo default since
          # the release job attaches them to a draft release anyway.
          retention-days: ${{ github.event_name == 'schedule' && '5' || '' }}

  release:
    runs-on: ubuntu-latest
    needs: [setup, build, combine]
    # Scheduled runs stop after `combine`: no tag, no draft release.
    # Cached releases skip the fill, so a skipped `build` is expected;
    # `setup` must have succeeded explicitly, because a failed `setup`
    # also leaves `build` skipped and would otherwise start this job
    # with empty outputs.
    if: always() && github.event_name == 'workflow_dispatch' && needs.setup.result == 'success' && (needs.build.result == 'success' || ((inputs.cached || inputs.commit != '') && needs.build.result == 'skipped')) && (needs.combine.result == 'success' || needs.combine.result == 'skipped')
    permissions:
      contents: write
      # Cached releases download the artifact from the resolved
      # nightly run rather than this one.
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.target_sha }}

      - name: Download release artifacts
        shell: bash
        run: |
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            # Cached release: download the resolved nightly's tarball by
            # exact name -- a young nightly's live split directories
            # would also match the fixtures_* pattern.
            gh run download "$ARTIFACT_RUN_ID" -n "$ARTIFACT_NAME" \
              --dir "./artifacts/$ARTIFACT_NAME"
          else
            gh run download ${{ github.run_id }} -p "fixtures_*" --dir ./artifacts
            rm -rf ./artifacts/fixtures__*/
            gh run download ${{ github.run_id }} -p "benchmark_genesis_*" --dir ./artifacts || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ needs.setup.outputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ needs.setup.outputs.artifact_name }}

      - name: Draft release
        shell: bash
        env:
          INPUT_FEATURE: ${{ inputs.feature }}
          INPUT_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ needs.setup.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_NAME="${INPUT_FEATURE}@${INPUT_VERSION}"
          # Git tags namespace fixture releases under `tests-<feature>@`, except
          # the default `tests` feature which tags as `tests@vX.Y.Z` (no doubled
          # prefix). The release title matches the git tag.
          if [ "$INPUT_FEATURE" = "tests" ]; then
            TAG_NAME="$RELEASE_NAME"
            TAG_GLOB="tests@v*"
          else
            TAG_NAME="tests-${RELEASE_NAME}"
            TAG_GLOB="tests-${INPUT_FEATURE}@v*"
          fi

          # Use the prior release of the same feature as the notes baseline.
          PREV_TAG=$(
            git tag --list "$TAG_GLOB" --sort=-v:refname \
              | grep -v "^${TAG_NAME}$" \
              | head -n 1 \
            || true
          )

          # Pin the tag to the single SHA resolved in `setup` so the tag
          # lands on the same commit every job built from.
          TARGET="$TARGET_SHA"

          # All fixture releases are drafted as prereleases; publish manually.
          RELEASE_ARGS=(
            --draft
            --prerelease
            --generate-notes
            --target "$TARGET"
            --title "$TAG_NAME"
          )
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          # Creates the tag on the target commit and the release on success.
          gh release create "$TAG_NAME" "${RELEASE_ARGS[@]}" ./artifacts/**/*.tar.gz
