name: Benchmark Fill Parity

on:
  pull_request:
  workflow_dispatch:
    inputs:
      evm_repo:
        description: "Override the t8n tool repo of zkevm-benchmark in evm.yaml"
        required: false
        type: string
        default: ""
      evm_ref:
        description: "Override the t8n tool branch or commit of zkevm-benchmark in evm.yaml"
        required: false
        type: string
        default: ""
      benchmark_file:
        description: "Benchmark test file to fill"
        required: false
        type: string
        default: "tests/benchmark/compute/instruction/test_memory.py"
      fill_fork:
        description: "Fork to fill"
        required: false
        type: string
        default: "Amsterdam"
      xdist_workers:
        description: "Number of fill workers"
        required: false
        type: string
        default: "auto"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  BENCHMARK_FILE: ${{ inputs.benchmark_file || 'tests/benchmark/compute/instruction/test_memory.py' }}
  FILL_FORK: ${{ inputs.fill_fork || 'Amsterdam' }}
  XDIST_WORKERS: ${{ inputs.xdist_workers || 'auto' }}

jobs:
  compare-fills:
    name: Compare Python and zkevm-benchmark t8n fills
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          enable-cache: "false"

      - name: Install dependencies
        run: uv sync --no-progress

      # The t8n tool that fills the zkevm-benchmark release, so a PR can't
      # break its parity with the Python spec.
      - name: Build the zkevm-benchmark t8n tool
        id: evm-builder
        uses: ./.github/actions/build-evm-base
        with:
          type: zkevm-benchmark
          repo_override: ${{ inputs.evm_repo }}
          ref_override: ${{ inputs.evm_ref }}

      - name: Validate benchmark file input
        shell: bash
        run: |
          case "$BENCHMARK_FILE" in
            ./*)
              echo "benchmark_file must be relative to the repository root without a leading ./"
              exit 1
              ;;
            tests/benchmark/*.py)
              ;;
            *)
              echo "benchmark_file must be a Python file under tests/benchmark/"
              exit 1
              ;;
          esac

          if [ ! -f "$BENCHMARK_FILE" ]; then
            echo "benchmark_file does not exist: $BENCHMARK_FILE"
            exit 1
          fi

      - name: Prepare fill directories
        run: mkdir -p fill_tmp/python fill_tmp/t8n fill_logs/python fill_logs/t8n

      - name: Fill benchmark with Python spec
        run: |
          uv run fill \
            --clean \
            --gas-benchmark-values 1 \
            --fork "$FILL_FORK" \
            -m blockchain_test \
            -n "$XDIST_WORKERS" \
            --output=fixtures_python \
            --no-html \
            --basetemp=fill_tmp/python \
            --log-to fill_logs/python \
            "$BENCHMARK_FILE"

      - name: Fill benchmark with the zkevm-benchmark t8n tool
        env:
          EVM_BIN: ${{ steps.evm-builder.outputs.evm-bin }}
        run: |
          uv run fill \
            --clean \
            --gas-benchmark-values 1 \
            --fork "$FILL_FORK" \
            --evm-bin="$EVM_BIN" \
            -m blockchain_test \
            -n "$XDIST_WORKERS" \
            --output=fixtures_t8n \
            --no-html \
            --basetemp=fill_tmp/t8n \
            --log-to fill_logs/t8n \
            "$BENCHMARK_FILE"

      - name: Compare fixture hashes
        run: uv run hasher compare fixtures_python fixtures_t8n

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: benchmark-fill-parity-debug
          path: |
            fixtures_python/
            fixtures_t8n/
            fill_logs/
          if-no-files-found: ignore
