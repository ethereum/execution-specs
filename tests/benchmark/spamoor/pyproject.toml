[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eels-spamoor-builders"
version = "0.1.0"
description = "Standalone Ethereum tx builders extracted from execution-specs Spamoor scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "eth-abi>=4,<6",
    "eth-utils>=2,<6",
]

[project.optional-dependencies]
# Spamoor's pytest test helpers (`spamoor_signer_context`, `broadcast_and_assert_receipts`)
# import pytest + execution_testing.test_types lazily; consumers that only need the
# build_* functions can omit this.
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ethereum/execution-specs"

[tool.setuptools]
packages = ["eels_spamoor_builders"]

[tool.setuptools.package-dir]
eels_spamoor_builders = "."
