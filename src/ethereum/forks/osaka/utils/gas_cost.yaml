# Gas Cost Configuration for Gas Repricing Fork
# This YAML file serves as the single source of truth for gas costs in the gas_repricing fork.
# It contains both static gas cost constants and opcode-to-gas-category mappings.
# Reference: https://github.com/ethereum/execution-specs/issues/1599

# Static Gas Costs
# These constants define the base gas costs for various operation categories
# Variable names follow the test framework convention (G_ prefix)
static_costs:
  # Basic operation costs
  GAS_JUMPDEST: 1
  GAS_BASE: 2
  GAS_VERY_LOW: 3
  GAS_LOW: 5
  GAS_MID: 8
  GAS_HIGH: 10

  # Storage costs
  GAS_STORAGE_SET: 20000
  GAS_STORAGE_UPDATE: 5000
  GAS_STORAGE_CLEAR_REFUND: 4800

  # Access costs (EIP-2929)
  GAS_COLD_SLOAD: 2100
  GAS_COLD_ACCOUNT_ACCESS: 2600
  GAS_WARM_ACCESS: 100
  G_WARM_SLOAD: 100
  G_ACCESS_LIST_ADDRESS: 2400
  G_ACCESS_LIST_STORAGE: 1900

  # Exponentiation costs
  GAS_EXPONENTIATION: 10
  GAS_EXPONENTIATION_PER_BYTE: 50

  # Memory costs
  GAS_MEMORY: 3

  # Keccak256 costs
  GAS_KECCAK256: 30
  GAS_KECCAK256_WORD: 6

  # Copy operation costs
  GAS_COPY: 3

  # Block operation costs
  GAS_BLOCK_HASH: 20

  # Log costs
  GAS_LOG: 375
  GAS_LOG_DATA: 8
  GAS_LOG_TOPIC: 375

  # Create costs
  GAS_CREATE: 32000
  GAS_CODE_DEPOSIT: 200

  # Transaction costs
  G_TRANSACTION: 21000
  G_TRANSACTION_CREATE: 32000

  # Account creation and value transfer costs
  GAS_NEW_ACCOUNT: 25000
  GAS_CALL_VALUE: 9000
  GAS_CALL_STIPEND: 2300

  # Self-destruct costs
  GAS_SELF_DESTRUCT: 5000

  # Transaction data costs
  G_TX_DATA_ZERO: 4
  G_TX_DATA_NON_ZERO: 16
  G_TX_DATA_STANDARD_TOKEN_COST: 4
  G_TX_DATA_FLOOR_TOKEN_COST: 10

  # Init code costs (EIP-3860)
  G_INITCODE_WORD: 2

  # Authorization costs (EIP-7702)
  G_AUTHORIZATION: 25000
  R_AUTHORIZATION_EXISTING_AUTHORITY: 12500


# Opcode to Gas Category Mappings
# Maps each EVM opcode to its corresponding gas cost constant
# Opcodes with dynamic costs (e.g., SLOAD, CALL) have their base costs listed here
opcode_costs:
  STOP: GAS_BASE
  ADD: GAS_VERY_LOW
  MUL: GAS_LOW
  SUB: GAS_VERY_LOW
  DIV: GAS_LOW
  SDIV: GAS_LOW
  MOD: GAS_LOW
  SMOD: GAS_LOW
  ADDMOD: GAS_MID
  MULMOD: GAS_MID
  EXP: GAS_EXPONENTIATION
  SIGNEXTEND: GAS_LOW

  # Comparison operations
  LT: GAS_VERY_LOW
  GT: GAS_VERY_LOW
  SLT: GAS_VERY_LOW
  SGT: GAS_VERY_LOW
  EQ: GAS_VERY_LOW
  ISZERO: GAS_VERY_LOW

  # Bitwise operations
  AND: GAS_VERY_LOW
  OR: GAS_VERY_LOW
  XOR: GAS_VERY_LOW
  NOT: GAS_VERY_LOW
  BYTE: GAS_VERY_LOW
  SHL: GAS_VERY_LOW
  SHR: GAS_VERY_LOW
  SAR: GAS_VERY_LOW
  CLZ: GAS_LOW

  # Keccak operation
  KECCAK: GAS_KECCAK256  # 0x20 - plus GAS_KECCAK256_WORD per word

  # Environmental operations
  ADDRESS: GAS_BASE
  BALANCE: GAS_COLD_ACCOUNT_ACCESS
  ORIGIN: GAS_BASE
  CALLER: GAS_BASE
  CALLVALUE: GAS_BASE
  CALLDATALOAD: GAS_VERY_LOW
  CALLDATASIZE: GAS_BASE
  CALLDATACOPY: GAS_VERY_LOW
  CODESIZE: GAS_BASE
  CODECOPY: GAS_VERY_LOW
  GASPRICE: GAS_BASE
  EXTCODESIZE: GAS_COLD_ACCOUNT_ACCESS
  EXTCODECOPY: GAS_COLD_ACCOUNT_ACCESS
  RETURNDATASIZE: GAS_BASE
  RETURNDATACOPY: GAS_VERY_LOW
  EXTCODEHASH: GAS_COLD_ACCOUNT_ACCESS

  # Block operations
  BLOCKHASH: GAS_BLOCK_HASH
  COINBASE: GAS_BASE
  TIMESTAMP: GAS_BASE
  NUMBER: GAS_BASE
  PREVRANDAO: GAS_BASE
  GASLIMIT: GAS_BASE
  CHAINID: GAS_BASE
  SELFBALANCE: GAS_LOW
  BASEFEE: GAS_BASE
  BLOBHASH: GAS_BASE
  BLOBBASEFEE: GAS_BASE

  # Memory operations
  MLOAD: GAS_VERY_LOW
  MSTORE: GAS_VERY_LOW
  MSTORE8: GAS_VERY_LOW
  MSIZE: GAS_BASE
  MCOPY: GAS_VERY_LOW

  # Stack operations
  POP: GAS_BASE

  # Storage operations
  SLOAD: GAS_COLD_SLOAD
  SSTORE: GAS_STORAGE_SET
  TLOAD: G_WARM_SLOAD
  TSTORE: G_WARM_SLOAD

  # Control flow operations
  JUMP: GAS_MID
  JUMPI: GAS_HIGH
  PC: GAS_BASE
  GAS: GAS_BASE
  JUMPDEST: GAS_JUMPDEST

  # Push operations
  PUSH0: GAS_BASE
  PUSH: GAS_VERY_LOW

  # DUP1-16 operations
  DUP: GAS_VERY_LOW

  # Swap operations
  SWAP: GAS_VERY_LOW

  # Log operations
  LOG0: GAS_LOG

  # System operations
  CREATE: GAS_CREATE
  CALL: GAS_COLD_ACCOUNT_ACCESS
  CALLCODE: GAS_COLD_ACCOUNT_ACCESS
  RETURN: GAS_BASE
  DELEGATECALL: GAS_COLD_ACCOUNT_ACCESS
  CREATE2: GAS_CREATE
  STATICCALL: GAS_COLD_ACCOUNT_ACCESS
  REVERT: GAS_BASE
  SELFDESTRUCT: GAS_SELF_DESTRUCT