[pytest]
console_output_style = count
minversion = 7.0
python_files = eval_*.py
python_functions = eval_*
testpaths = tests/
addopts =
    -p execution_testing.cli.pytest_commands.plugins.shared.transition_tool
    -p execution_testing.cli.pytest_commands.plugins.evaluate.evaluate
    -p execution_testing.cli.pytest_commands.plugins.forks.forks
    -p execution_testing.cli.pytest_commands.plugins.filler.pre_alloc
    --tb short
