[pytest]
console_output_style = count
minversion = 7.0
python_files = test_*.py
testpaths = tests/benchmark/testing_build_block/
addopts =
    -p execution_testing.cli.pytest_commands.plugins.testing_build_block.testing_build_block
    -p execution_testing.cli.pytest_commands.plugins.spamoor.spamoor
    -p execution_testing.cli.pytest_commands.plugins.help.help
    -p execution_testing.cli.pytest_commands.plugins.custom_logging.plugin_logging
    --tb short
